name: assemble-monoliths
on:
  push:
    paths:
      - "parts-css/**"
      - "parts-js/**"
      - "parts-data/**"
      - "TRIGGER"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate parts into monoliths
        run: |
          set -euo pipefail
          shopt -s nullglob
          css=(parts-css/*.txt)
          js=(parts-js/*.txt)
          data=(parts-data/*.txt)
          test ${#css[@]} -gt 0 && test ${#js[@]} -gt 0 && test ${#data[@]} -gt 0
          cat "${css[@]}" > assets-index-BSI9EAX6.css
          cat "${js[@]}" > assets-index-B62bK7Wg.js
          cat "${data[@]}" > data-index.json
          echo "85d77b82dda9f5771db744ee12008982  assets-index-BSI9EAX6.css" | md5sum -c -
          echo "ff52f760c79bb8b21f2c3d52fdd2ebd2  assets-index-B62bK7Wg.js" | md5sum -c -
          echo "6ad5c7e8f5c65b0f1ef4f72b321b9e4a  data-index.json" | md5sum -c -
          grep -q 'body.booth' assets-index-BSI9EAX6.css
          rm -rf parts-css parts-js parts-data TRIGGER
      - name: Commit monoliths
        run: |
          set -euo pipefail
          git config user.name "ramkandimalla"
          git config user.email "37137053+ramkandimalla94@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "build: assemble Vite monoliths from utf-8 parts"
          git push
